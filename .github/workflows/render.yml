name: render
on:
  workflow_dispatch:
    inputs:
      preview:
        description: "1 = 4 small test frames per scene, 0 = full 10s render"
        default: "1"
      scenes:
        description: "json list of scenes"
        default: '["assassin","fern"]'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scene: ${{ fromJSON(inputs.scenes) }}
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: install blender 4.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libegl1
          curl -sSL -o b.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          mkdir blender && tar -xf b.tar.xz -C blender --strip-components=1
          echo "$PWD/blender" >> $GITHUB_PATH
          ./blender/blender --version | head -2
      - name: render shard
        run: |
          mkdir -p out
          cat scenes/common.py scenes/${{ matrix.scene }}.py > run.py
          blender -b -noaudio -P run.py -- --shard ${{ matrix.shard }} --shards 8 --out out --preview ${{ inputs.preview }}
          ls out | head
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.scene }}-${{ matrix.shard }}
          path: out/
          if-no-files-found: ignore
          retention-days: 3

  assemble:
    needs: render
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        scene: ${{ fromJSON(inputs.scenes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: frames-${{ matrix.scene }}-*
          path: frames
          merge-multiple: true
      - name: install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: make video or contact sheet
        run: bash scripts/assemble.sh ${{ matrix.scene }} ${{ inputs.preview }}
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.scene }}
          path: final/
          retention-days: 5
      - name: publish to out branch
        run: |
          cp -r final /tmp/final
          git config user.name actions
          git config user.email actions@users.noreply.github.com
          git fetch origin out:out 2>/dev/null || true
          if git show-ref --verify --quiet refs/heads/out; then
            git checkout -q out
          else
            git checkout -q --orphan out
            git rm -rf -q .
          fi
          mkdir -p ${{ matrix.scene }}
          cp /tmp/final/* ${{ matrix.scene }}/
          git add ${{ matrix.scene }}
          git commit -q -m "render ${{ matrix.scene }} preview=${{ inputs.preview }}"
          for i in 1 2 3 4 5 6; do
            git push origin out && break
            git pull -q --rebase origin out || true
            sleep 4
          done
